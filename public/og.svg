<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a0a10"/>
      <stop offset="100%" stop-color="#2d0f1c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="171" y1="0" x2="171" y2="630"/>
    <line x1="342" y1="0" x2="342" y2="630"/>
    <line x1="513" y1="0" x2="513" y2="630"/>
    <line x1="684" y1="0" x2="684" y2="630"/>
    <line x1="855" y1="0" x2="855" y2="630"/>
    <line x1="1026" y1="0" x2="1026" y2="630"/>
  </g>

  <!-- Decorative calendar mock (right side) -->
  <g opacity="0.12">
    <!-- Calendar card -->
    <rect x="660" y="80" width="480" height="470" rx="24" fill="white"/>
    <!-- Header -->
    <rect x="660" y="80" width="480" height="64" rx="24" fill="#732442"/>
    <rect x="660" y="120" width="480" height="24" fill="#732442"/>
    <!-- Day labels -->
    <rect x="688" y="164" width="40" height="10" rx="3" fill="#732442" opacity="0.4"/>
    <rect x="756" y="164" width="40" height="10" rx="3" fill="#732442" opacity="0.4"/>
    <rect x="824" y="164" width="40" height="10" rx="3" fill="#732442" opacity="0.4"/>
    <rect x="892" y="164" width="40" height="10" rx="3" fill="#732442" opacity="0.4"/>
    <rect x="960" y="164" width="40" height="10" rx="3" fill="#732442" opacity="0.4"/>
    <rect x="1028" y="164" width="40" height="10" rx="3" fill="#732442" opacity="0.4"/>
    <rect x="1096" y="164" width="40" height="10" rx="3" fill="#732442" opacity="0.4"/>
    <!-- Grid lines -->
    <line x1="660" y1="190" x2="1140" y2="190" stroke="#e8eaed" stroke-width="1"/>
    <line x1="660" y1="258" x2="1140" y2="258" stroke="#e8eaed" stroke-width="1"/>
    <line x1="660" y1="326" x2="1140" y2="326" stroke="#e8eaed" stroke-width="1"/>
    <line x1="660" y1="394" x2="1140" y2="394" stroke="#e8eaed" stroke-width="1"/>
    <line x1="660" y1="462" x2="1140" y2="462" stroke="#e8eaed" stroke-width="1"/>
    <line x1="728" y1="190" x2="728" y2="544" stroke="#e8eaed" stroke-width="1"/>
    <line x1="796" y1="190" x2="796" y2="544" stroke="#e8eaed" stroke-width="1"/>
    <line x1="864" y1="190" x2="864" y2="544" stroke="#e8eaed" stroke-width="1"/>
    <line x1="932" y1="190" x2="932" y2="544" stroke="#e8eaed" stroke-width="1"/>
    <line x1="1000" y1="190" x2="1000" y2="544" stroke="#e8eaed" stroke-width="1"/>
    <line x1="1068" y1="190" x2="1068" y2="544" stroke="#e8eaed" stroke-width="1"/>
    <!-- Publication pills -->
    <rect x="668" y="200" width="52" height="18" rx="5" fill="#E84B8A"/>
    <rect x="736" y="200" width="52" height="18" rx="5" fill="#F59E0B"/>
    <rect x="804" y="218" width="52" height="18" rx="5" fill="#3B82F6"/>
    <rect x="872" y="200" width="52" height="18" rx="5" fill="#10B981"/>
    <rect x="1008" y="200" width="52" height="18" rx="5" fill="#8B5CF6"/>
    <rect x="668" y="268" width="52" height="18" rx="5" fill="#F97316"/>
    <rect x="804" y="268" width="52" height="18" rx="5" fill="#732442"/>
    <rect x="940" y="268" width="52" height="18" rx="5" fill="#06B6D4"/>
    <rect x="1076" y="268" width="52" height="18" rx="5" fill="#E84B8A"/>
    <rect x="736" y="336" width="52" height="18" rx="5" fill="#10B981"/>
    <rect x="872" y="336" width="52" height="18" rx="5" fill="#3B82F6"/>
    <rect x="1008" y="336" width="52" height="18" rx="5" fill="#8B5CF6"/>
    <rect x="668" y="404" width="52" height="18" rx="5" fill="#F97316"/>
    <rect x="804" y="404" width="52" height="18" rx="5" fill="#732442"/>
    <rect x="940" y="404" width="52" height="18" rx="5" fill="#F59E0B"/>
    <rect x="736" y="472" width="52" height="18" rx="5" fill="#E84B8A"/>
    <rect x="1008" y="472" width="52" height="18" rx="5" fill="#10B981"/>
  </g>

  <!-- Glow accent -->
  <ellipse cx="200" cy="315" rx="280" ry="220" fill="#732442" opacity="0.18"/>

  <!-- Logo icon background -->
  <rect x="80" y="180" width="96" height="96" rx="24" fill="#732442"/>
  <!-- Logo C shape (simplified) -->
  <text x="128" y="246" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle">C</text>

  <!-- App name -->
  <text x="80" y="330" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="white" letter-spacing="-2">CALENDAPP</text>

  <!-- Tagline -->
  <text x="80" y="390" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="white" opacity="0.6">Gestiona tu calendario editorial</text>
  <text x="80" y="426" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="white" opacity="0.6">de publicaciones en un solo lugar.</text>

  <!-- Divider -->
  <rect x="80" y="468" width="48" height="3" rx="2" fill="#732442"/>

  <!-- Footer brand -->
  <text x="80" y="516" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="white" opacity="0.35">by El Chandrio Group</text>

  <!-- Color dots decoration -->
  <circle cx="80" cy="560" r="6" fill="#E84B8A"/>
  <circle cx="100" cy="560" r="6" fill="#F59E0B"/>
  <circle cx="120" cy="560" r="6" fill="#10B981"/>
  <circle cx="140" cy="560" r="6" fill="#3B82F6"/>
  <circle cx="160" cy="560" r="6" fill="#8B5CF6"/>
  <circle cx="180" cy="560" r="6" fill="#F97316"/>
</svg>
